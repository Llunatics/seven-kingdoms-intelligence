version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seven-kingdoms-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/seven_kingdoms?schema=public
      - REDIS_URL=redis://redis:6379
      - ICE_AND_FIRE_API_URL=https://anapioficeandfire.com/api
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seven-kingdoms-net

  postgres:
    image: postgres:16-alpine
    container_name: seven-kingdoms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seven_kingdoms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seven_kingdoms"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seven-kingdoms-net

  redis:
    image: redis:7-alpine
    container_name: seven-kingdoms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seven-kingdoms-net

volumes:
  postgres_data:
  redis_data:

networks:
  seven-kingdoms-net:
    driver: bridge
